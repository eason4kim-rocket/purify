services:
  purify:
    build: .
    # Both are parameterized so this stack can coexist with an unrelated
    # purify deployment on the same host.
    container_name: ${PURIFY_CONTAINER_NAME:-purify}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PURIFY_BIND_PORT:-8080}:8080"
    environment:
      # ── Server ──
      PURIFY_MODE: release
      PURIFY_MAX_PAGES: "10"
      # Ambient HTTP(S)_PROXY is ignored; this is the only explicit proxy.
      PURIFY_PROXY: "${PURIFY_PROXY:-}"
      # ── Auth (generate a strong key: openssl rand -hex 32) ──
      PURIFY_AUTH_ENABLED: "true"
      PURIFY_API_KEYS: "${PURIFY_API_KEYS}"
      # ── Rate limit ──
      # Search is registered at burst >=1, while individual weighted requests
      # still require enough tokens (maximum trust Search 59; legacy max 22).
      PURIFY_RATE_RPS: "5"
      PURIFY_RATE_BURST: "59"
      # ── Local search index ──
      # Defaults into the durable volume. Search stays unavailable until the
      # file exists, so this is safe before the first purify-index run:
      #   docker compose exec purify purify-index \
      #     -seeds /data/seeds.json -out /data/index.db -max-pages 100000
      #   docker compose restart purify   # the index is opened at startup
      PURIFY_SEARCH_INDEX_PATH: "${PURIFY_SEARCH_INDEX_PATH:-/data/index.db}"
      # ── Process-owned metadata reranker (default-off; no sidecar here) ──
      PURIFY_RERANK_ENABLED: "${PURIFY_RERANK_ENABLED:-false}"
      PURIFY_RERANK_ENDPOINT: "${PURIFY_RERANK_ENDPOINT:-}"
      PURIFY_RERANK_API_KEY: "${PURIFY_RERANK_API_KEY:-}"
      PURIFY_RERANK_PROFILE: "${PURIFY_RERANK_PROFILE:-qwen3-reranker-0.6b-v1}"
      PURIFY_RERANK_ALLOW_PRIVATE: "${PURIFY_RERANK_ALLOW_PRIVATE:-false}"
      PURIFY_RERANK_TIMEOUT_SECONDS: "${PURIFY_RERANK_TIMEOUT_SECONDS:-5}"
      # ── Managed entity attribution (default-off) ──
      PURIFY_EAV_ENABLED: "${PURIFY_EAV_ENABLED:-false}"
      PURIFY_EAV_REFEREE_ENABLED: "${PURIFY_EAV_REFEREE_ENABLED:-true}"
      PURIFY_EAV_CACHE_ENTRIES: "${PURIFY_EAV_CACHE_ENTRIES:-128}"
      PURIFY_EAV_LLM_API_KEY: "${PURIFY_EAV_LLM_API_KEY:-}"
      PURIFY_EAV_LLM_MODEL: "${PURIFY_EAV_LLM_MODEL:-gpt-4o-mini}"
      PURIFY_EAV_LLM_BASE_URL: "${PURIFY_EAV_LLM_BASE_URL:-https://api.openai.com/v1}"
      PURIFY_EAV_LLM_ALLOW_PRIVATE: "${PURIFY_EAV_LLM_ALLOW_PRIVATE:-false}"
      # ── Logging ──
      PURIFY_LOG_LEVEL: info
      # ── Durable evidence storage ──
      PURIFY_DATA_DIR: "/data"
      PURIFY_SNAPSHOT_ENABLED: "true"
    volumes:
      - purify-data:/data
    # SHM size for Chromium (default 64MB too small, causes crashes).
    shm_size: 512m
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g

volumes:
  purify-data:
