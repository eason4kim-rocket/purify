services:
  purify:
    build: .
    # Both are parameterized so this stack can coexist with an unrelated
    # purify deployment on the same host.
    container_name: ${PURIFY_CONTAINER_NAME:-purify}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PURIFY_BIND_PORT:-8080}:8080"
    environment:
      # ── Server ──
      PURIFY_MODE: release
      PURIFY_MAX_PAGES: "10"
      # ── Auth (generate a strong key: openssl rand -hex 32) ──
      PURIFY_AUTH_ENABLED: "true"
      PURIFY_API_KEYS: "${PURIFY_API_KEYS}"
      # ── Rate limit ──
      # Burst must cover the most expensive weighted request or its
      # capability gate stays closed: search 22, answer 17, watch 1.
      PURIFY_RATE_RPS: "5"
      PURIFY_RATE_BURST: "30"
      # ── Search provider (empty leaves search/answer/watch disabled) ──
      PURIFY_SEARCH_BRAVE_KEY: "${PURIFY_SEARCH_BRAVE_KEY:-}"
      # ── Managed entity attribution (default-off) ──
      PURIFY_EAV_ENABLED: "${PURIFY_EAV_ENABLED:-false}"
      PURIFY_EAV_REFEREE_ENABLED: "${PURIFY_EAV_REFEREE_ENABLED:-true}"
      PURIFY_EAV_CACHE_ENTRIES: "${PURIFY_EAV_CACHE_ENTRIES:-128}"
      PURIFY_EAV_LLM_API_KEY: "${PURIFY_EAV_LLM_API_KEY:-}"
      PURIFY_EAV_LLM_MODEL: "${PURIFY_EAV_LLM_MODEL:-gpt-4o-mini}"
      PURIFY_EAV_LLM_BASE_URL: "${PURIFY_EAV_LLM_BASE_URL:-https://api.openai.com/v1}"
      PURIFY_EAV_LLM_ALLOW_PRIVATE: "${PURIFY_EAV_LLM_ALLOW_PRIVATE:-false}"
      # ── Logging ──
      PURIFY_LOG_LEVEL: info
      # ── Durable evidence storage ──
      PURIFY_DATA_DIR: "/data"
      PURIFY_SNAPSHOT_ENABLED: "true"
    volumes:
      - purify-data:/data
    # SHM size for Chromium (default 64MB too small, causes crashes).
    shm_size: 512m
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g

volumes:
  purify-data:
