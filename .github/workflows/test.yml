name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install fixed Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 151.0.7922.77

      - name: Test with race detector
        env:
          CI: "true"
          PURIFY_BROWSER_TEST: "1"
          PURIFY_BROWSER_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: go test -race -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Check whitespace
        run: git diff --check
