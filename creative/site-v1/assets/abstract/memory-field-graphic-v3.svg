<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
  <title id="title">An abstract blue modular weave</title>
  <desc id="desc">Repeated blue square sequences weave over and under one another without resolving into a literal object.</desc>
  <defs>
    <g id="chain-a">
      <rect x="0" y="0" width="144" height="144"/>
      <rect x="168" y="24" width="96" height="96"/>
      <rect x="288" y="48" width="64" height="64"/>
      <rect x="376" y="64" width="40" height="40"/>
      <rect x="440" y="76" width="24" height="24"/>
      <rect x="488" y="84" width="12" height="12"/>
    </g>
    <g id="chain-b">
      <rect x="0" y="0" width="96" height="96"/>
      <rect x="112" y="40" width="72" height="72"/>
      <rect x="200" y="72" width="52" height="52"/>
      <rect x="268" y="96" width="36" height="36"/>
      <rect x="320" y="112" width="20" height="20"/>
    </g>
  </defs>

  <g style="mix-blend-mode:multiply">
    <g fill="#d7ebef">
      <use href="#chain-a" x="-74" y="82"/>
      <use href="#chain-a" x="860" y="-26" transform="rotate(90 1110 224)"/>
      <use href="#chain-a" x="1006" y="498" transform="rotate(180 1256 548)"/>
      <use href="#chain-b" x="186" y="568"/>
    </g>

    <g fill="#91c6d5" opacity=".88">
      <use href="#chain-a" x="184" y="238"/>
      <use href="#chain-a" x="786" y="326" transform="rotate(180 1036 376)"/>
      <use href="#chain-b" x="602" y="86" transform="rotate(90 772 256)"/>
      <use href="#chain-b" x="1148" y="214" transform="rotate(90 1318 384)"/>
    </g>

    <g fill="#4c96b3" opacity=".92">
      <use href="#chain-b" x="-32" y="442"/>
      <use href="#chain-a" x="442" y="368"/>
      <use href="#chain-b" x="882" y="104"/>
      <use href="#chain-b" x="1112" y="574" transform="rotate(180 1282 744)"/>
    </g>

    <g fill="#176f91">
      <use href="#chain-b" x="254" y="118"/>
      <use href="#chain-b" x="754" y="470"/>
      <use href="#chain-b" x="1096" y="286"/>
    </g>
  </g>

  <g fill="#fcfcf9">
    <rect x="0" y="328" width="248" height="64"/>
    <rect x="232" y="356" width="226" height="64"/>
    <rect x="442" y="384" width="292" height="64"/>
    <rect x="718" y="412" width="250" height="64"/>
    <rect x="952" y="440" width="236" height="64"/>
    <rect x="1172" y="468" width="268" height="64"/>
  </g>

  <g fill="#0b536f">
    <rect x="78" y="300" width="46" height="46"/>
    <rect x="142" y="322" width="23" height="23"/>
    <rect x="350" y="334" width="58" height="58"/>
    <rect x="428" y="360" width="29" height="29"/>
    <rect x="648" y="370" width="72" height="72"/>
    <rect x="740" y="398" width="36" height="36"/>
    <rect x="942" y="408" width="54" height="54"/>
    <rect x="1016" y="430" width="27" height="27"/>
    <rect x="1210" y="448" width="64" height="64"/>
    <rect x="1294" y="474" width="32" height="32"/>
  </g>
</svg>
