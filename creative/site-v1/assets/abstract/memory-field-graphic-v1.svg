      <rect x="338" y="310" width="24" height="24"/>

      <rect x="570" y="366" width="132" height="132"/>
      <rect x="718" y="330" width="66" height="66"/>
      <rect x="800" y="312" width="33" height="33"/>

      <rect x="916" y="236" width="108" height="108"/>
      <rect x="1040" y="268" width="54" height="54"/>
      <rect x="1110" y="296" width="27" height="27"/>

