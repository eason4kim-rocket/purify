      <rect x="462" y="202" width="38" height="38"/>
      <rect x="514" y="194" width="19" height="19"/>
      <rect x="794" y="396" width="92" height="92"/>
      <rect x="902" y="372" width="46" height="46"/>
      <rect x="964" y="360" width="23" height="23"/>
      <rect x="1194" y="484" width="72" height="72"/>
