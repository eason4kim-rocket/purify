<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
  <title id="title">An abstract field of blue square forms</title>
  <desc id="desc">Mineral-blue square modules repeat, overlap, break apart, and reconnect across an open white field.</desc>
  <defs>
    <pattern id="micro-light" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#c6e2e8"/>
    </pattern>
    <pattern id="micro-mid" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="11" height="11" fill="#78b9cf"/>
    </pattern>
    <pattern id="micro-deep" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#1f7798"/>
    </pattern>
    <g id="step-light">
      <rect x="0" y="0" width="112" height="112"/>
      <rect x="128" y="0" width="56" height="56"/>
      <rect x="200" y="0" width="28" height="28"/>
      <rect x="128" y="72" width="112" height="112"/>
      <rect x="256" y="72" width="56" height="56"/>
      <rect x="328" y="72" width="28" height="28"/>
      <rect x="256" y="144" width="112" height="112"/>
      <rect x="384" y="144" width="56" height="56"/>
      <rect x="456" y="144" width="28" height="28"/>
    </g>
    <g id="step-mid">
      <rect x="0" y="0" width="72" height="72"/>
      <rect x="88" y="0" width="36" height="36"/>
      <rect x="136" y="0" width="18" height="18"/>
      <rect x="88" y="48" width="72" height="72"/>
      <rect x="176" y="48" width="36" height="36"/>
      <rect x="224" y="48" width="18" height="18"/>
      <rect x="176" y="96" width="72" height="72"/>
      <rect x="264" y="96" width="36" height="36"/>
      <rect x="312" y="96" width="18" height="18"/>
    </g>
  </defs>

  <g style="mix-blend-mode:multiply">
    <g fill="#d9edf1" opacity=".96">
      <use href="#step-light" x="-78" y="80"/>
      <use href="#step-light" x="842" y="-44" transform="rotate(90 1084 198)"/>
      <use href="#step-light" x="1016" y="438" transform="rotate(180 1258 566)"/>
      <rect x="84" y="584" width="168" height="168"/>
      <rect x="270" y="648" width="84" height="84"/>
      <rect x="1298" y="286" width="196" height="196"/>
    </g>

    <g fill="url(#micro-light)" opacity=".92">
      <rect x="0" y="26" width="548" height="196"/>
      <rect x="224" y="222" width="504" height="168"/>
      <rect x="700" y="54" width="516" height="224"/>
      <rect x="924" y="278" width="516" height="168"/>
      <rect x="448" y="586" width="560" height="168"/>
    </g>

    <g fill="#9bcbd9" opacity=".84">
