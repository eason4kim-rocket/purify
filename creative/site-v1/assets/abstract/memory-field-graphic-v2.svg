<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
  <title id="title">An abstract composition of blue square fields</title>
  <desc id="desc">Cropped fields of blue square modules overlap around a generous white channel.</desc>
  <defs>
    <pattern id="grid-a" width="34" height="34" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#9bcdd9"/>
    </pattern>
    <pattern id="grid-b" width="34" height="34" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#4c96b3"/>
    </pattern>
    <pattern id="grid-c" width="34" height="34" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#176f91"/>
    </pattern>
  </defs>

  <g style="mix-blend-mode:multiply">
    <rect x="-126" y="74" width="454" height="454" fill="url(#grid-a)"/>
    <rect x="112" y="406" width="340" height="340" fill="#d7ebef"/>
    <rect x="242" y="170" width="374" height="374" fill="url(#grid-b)" opacity=".84"/>

    <rect x="498" y="-88" width="286" height="286" fill="#9bcbd9" opacity=".82"/>
    <rect x="532" y="216" width="422" height="422" fill="url(#grid-a)" opacity=".94"/>
    <rect x="696" y="302" width="246" height="246" fill="#4c96b3" opacity=".88"/>

    <rect x="886" y="40" width="306" height="306" fill="url(#grid-c)" opacity=".9"/>
    <rect x="1042" y="258" width="436" height="436" fill="url(#grid-b)" opacity=".78"/>
    <rect x="1204" y="-112" width="300" height="300" fill="#d7ebef"/>

    <rect x="356" y="488" width="176" height="176" fill="#77b9cd"/>
    <rect x="966" y="542" width="196" height="196" fill="#9bcbd9"/>
