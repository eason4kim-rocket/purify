    <rect x="408" y="294" width="96" height="96"/>
    <rect x="526" y="326" width="48" height="48"/>
    <rect x="592" y="342" width="24" height="24"/>

    <rect x="748" y="340" width="112" height="112"/>
    <rect x="884" y="378" width="56" height="56"/>
    <rect x="958" y="398" width="28" height="28"/>

    <rect x="1096" y="394" width="88" height="88"/>
    <rect x="1202" y="430" width="44" height="44"/>
    <rect x="1262" y="446" width="22" height="22"/>
