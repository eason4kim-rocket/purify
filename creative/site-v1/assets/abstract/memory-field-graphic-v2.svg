    <rect x="392" y="114" width="21" height="21"/>
    <rect x="796" y="104" width="56" height="56"/>
    <rect x="874" y="132" width="28" height="28"/>
    <rect x="1180" y="178" width="46" height="46"/>
    <rect x="1248" y="206" width="23" height="23"/>

